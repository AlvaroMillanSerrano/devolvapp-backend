spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  application:
    name: devolv_backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:devolvapp}
    username: ${POSTGRES_USER:manager}
    password: ${POSTGRES_PASSWORD:4321}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:demo}
    password: ${RABBITMQ_PASSWORD:demo}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzQURldmVsb3BtZW50T25seVNlY3JldEtleUZvckRldm9sdmFwcA==}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  bootstrap:
    admin:
      email: ${ADMIN_INITIAL_EMAIL:}
      password: ${ADMIN_INITIAL_PASSWORD:}
